<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/style.css?v=12"><title>المسابقة</title></head>
<body><div class="home"><h1>🎯 المسابقة</h1><div class="card" style="width:min(380px,92vw)">
<div class="row"><button id="b1" class="on" onclick="mode('login')" style="flex:1">دخول</button><button id="b2" onclick="mode('register')" style="flex:1">حساب جديد</button></div>
<input id="u" placeholder="اسم المستخدم" autocomplete="username"><input id="p" type="password" placeholder="كلمة السر" autocomplete="current-password" onkeydown="if(event.key==='Enter')go()">
<button class="on" style="width:100%;margin-top:8px" onclick="go()" id="go">دخول</button><div id="msg" style="color:#fca5a5;margin-top:8px;min-height:20px"></div></div></div>
<script>
let M='login';const $=i=>document.getElementById(i);
function mode(m){M=m;$('b1').className=m==='login'?'on':'';$('b2').className=m==='register'?'on':'';$('go').textContent=m==='login'?'دخول':'إنشاء حساب'}
async function go(){$('msg').textContent='';try{const r=await fetch('/api/'+M,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({u:$('u').value,p:$('p').value})});const j=await r.json();if(!r.ok)throw new Error(j.error);location='/tablet'}catch(e){$('msg').textContent=e.message}}
fetch('/api/me').then(r=>{if(r.ok)location='/tablet'});
</script></body></html>
