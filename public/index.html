<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#0b1425" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="المسابقة" />
    <script src="/js/theme.js?v=17"></script>
    <link rel="manifest" href="/manifest.json?v=2" />
    <link rel="icon" type="image/svg+xml" href="/assets/icons/favicon.svg?v=2" />
    <link rel="icon" type="image/png" href="/assets/icons/favicon.png?v=2" />
    <link rel="apple-touch-icon" href="/assets/icons/icon-192-v2.png" />
    <link rel="stylesheet" href="/css/style.css?v=30" />
    <title>المسابقة</title>
    <script src="/js/pwa.js?v=15" defer></script>
  </head>
  <body>
    <div class="home">
      <h1>🎯 المسابقة</h1>
      <div class="card" style="width: min(380px, 92vw)">
        <div class="row">
          <button id="b1" class="on" onclick="mode('login')" style="flex: 1">
            دخول</button
          ><button id="b2" onclick="mode('register')" style="flex: 1">
            حساب جديد
          </button>
        </div>
        <input
          id="u"
          placeholder="اسم المستخدم"
          autocomplete="username"
        /><input
          id="p"
          type="password"
          placeholder="كلمة السر"
          autocomplete="current-password"
          onkeydown="if(event.key==='Enter')go()"
        />
        <button
          class="on"
          style="width: 100%; margin-top: 8px"
          onclick="go()"
          id="go"
        >
          دخول
        </button>
        <button id="installApp" class="install-app" type="button" hidden>
          تثبيت التطبيق
        </button>
        <div
          id="msg"
          style="color: #fca5a5; margin-top: 8px; min-height: 20px"
        ></div>
      </div>
      <button
        class="btn on"
        type="button"
        onclick="openIntroVideo()"
        style="display: inline-flex; align-items: center; gap: 8px"
      >
        🎬 شاهد الفيديو التعريفي
      </button>
    </div>
    <div
      id="introVideoModal"
      class="intro-video-modal"
      role="dialog"
      aria-modal="true"
      aria-labelledby="introVideoTitle"
      hidden
      onclick="if(event.target===this)closeIntroVideo()"
    >
      <div class="intro-video-dialog">
        <div class="intro-video-dialog-header">
          <h2 id="introVideoTitle">الفيديو التعريفي</h2>
          <button type="button" aria-label="إغلاق الفيديو" onclick="closeIntroVideo()">
            إغلاق ✕
          </button>
        </div>
        <iframe
          id="homeIntroVideoFrame"
          src="about:blank"
          data-src="/code_artifact.html?embed=home"
          title="الفيديو التعريفي للمسابقة"
          allow="autoplay; fullscreen"
        ></iframe>
      </div>
    </div>
    <script>
      function openIntroVideo() {
        const modal = document.getElementById("introVideoModal");
        const frame = document.getElementById("homeIntroVideoFrame");
        frame.src = frame.dataset.src;
        modal.hidden = false;
      }
      function closeIntroVideo() {
        const modal = document.getElementById("introVideoModal");
        document.getElementById("homeIntroVideoFrame").src = "about:blank";
        modal.hidden = true;
      }
      document.addEventListener("keydown", (event) => {
        if (event.key === "Escape") closeIntroVideo();
      });
    </script>
    <script src="/js/index.js?v=15"></script>
    <footer class="site-footer">
        <p>جميع الحقوق محفوظة <a href="https://abdelrhman333e-web.vercel.app/" target="_blank" rel="noreferrer">abdo</a> &copy; 2026</p>
    </footer>

  </body>
</html>
