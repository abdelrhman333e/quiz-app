<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#101c30" />
    <title>جرس المتسابقين</title>
    <link rel="stylesheet" href="/css/buzzer.css?v=5" />
    <script src="/js/buzzer.js?v=5" defer></script>
  </head>
  <body>
    <main class="buzzer-shell">
      <header class="buzzer-brand">
        <span class="brand-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" role="img">
            <path d="M18 16H6l1.4-1.7V10a4.6 4.6 0 0 1 9.2 0v4.3L18 16Z"></path>
            <path d="M10 18.2h4M12 3V1.8"></path>
          </svg>
        </span>
        <div>
          <h1>جرس المتسابقين</h1>
          <p>اختار اسمك واستعد للضغط أولًا</p>
        </div>
      </header>
      <form id="roomForm" class="room-form">
        <label for="roomCode">رمز الغرفة</label>
        <div class="room-entry">
          <input
            id="roomCode"
            name="room"
            inputmode="text"
            autocomplete="off"
            autocapitalize="characters"
            maxlength="8"
            pattern="[A-Fa-f0-9]{8}"
            placeholder="مثال: a1b2c3d4"
            required
          />
          <button type="submit" class="primary">دخول الغرفة</button>
        </div>
      </form>
      <section id="buzzerPanel" class="buzzer-panel" hidden>
        <div class="room-badge">الغرفة <b id="joinedRoom"></b></div>
        <p id="connectionStatus" class="connection-status" role="status">
          جاري الاتصال...
        </p>
        <div class="contestant-heading">
          <h2>اختار اسمك</h2>
          <small>اختيارك يُحفظ على هذا الجهاز</small>
        </div>
        <div id="contestants" class="contestants"></div>
        <p id="questionStatus" class="question-status" role="status">
          استنى مقدم المسابقة يعرض السؤال
        </p>
        <button id="buzzButton" class="buzz-button" type="button" disabled>
          <span class="buzz-button-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24">
              <path d="M18 16H6l1.4-1.7V10a4.6 4.6 0 0 1 9.2 0v4.3L18 16Z"></path>
              <path d="M10 18.2h4M12 3V1.8"></path>
            </svg>
          </span>
          <b>اضغط الجرس</b>
          <small>سيتم تسجيل أسرع ضغطة</small>
        </button>
      </section>
      <p class="buzzer-help">
        لازم يكون اسمك مضافًا في قائمة المتسابقين عند مقدم المسابقة.
      </p>
    </main>
    <div id="contestantPasswordModal" class="password-modal" hidden>
      <form id="contestantPasswordForm" class="password-dialog" role="dialog" aria-modal="true" aria-labelledby="passwordTitle">
        <h2 id="passwordTitle">تأكيد هوية المتسابق</h2>
        <p id="passwordContestantName"></p>
        <label for="contestantPassword">الرمز الخاص بك</label>
        <input id="contestantPassword" type="password" inputmode="numeric" autocomplete="off" maxlength="20" />
        <p id="passwordError" class="password-error" role="alert"></p>
        <div class="password-actions">
          <button id="confirmContestantPassword" type="submit" class="primary">تأكيد الاسم</button>
          <button type="button" id="cancelContestantPassword">إلغاء</button>
        </div>
      </form>
    </div>
  </body>
</html>
