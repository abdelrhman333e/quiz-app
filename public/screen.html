<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <link rel="stylesheet" href="/style.css?v=20" />
    <title>شاشة العرض</title>
  </head>
  <body>
    <div id="app"></div>
    <script src="/common.js"></script>
    <script>
      const room = location.pathname.split("/")[2];
      let reverseTimer, rouletteTimer;
      let lastQuestionAudioKey = "";
      let lastQuestionAudioControlKey = "";
      let screenAudioUnlocked = false;
      let screenVideoUnlocked = false,
        screenVideoAutoplayBlocked = false;
      let sfxContext = null,
        sfxEnabled = false,
        lastResultKey = "",
        lastBuzzKey = "",
        lastReverseLetter = "";
      const resultSounds = {
        correct: new Audio("/sound/correct.wav"),
        wrong: new Audio("/sound/lose.wav"),
      };
      let lastQuestionKey = "",
        lastOptionsKey = "",
        lastAnswerKey = "",
        lastTop5Key = "",
        lastRevealedRanks = [];
      function toggleSfx() {
        if (!sfxContext) {
          const AudioContextClass =
            window.AudioContext || window.webkitAudioContext;
          if (!AudioContextClass) return;
          sfxContext = new AudioContextClass();
        }
        sfxEnabled = !sfxEnabled;
        if (sfxEnabled) sfxContext.resume().then(() => playSfx("question"));
        updateSfxButton();
      }
      function updateSfxButton() {
        const button = document.getElementById("screenSfxToggle");
        if (button) {
          button.textContent = sfxEnabled
            ? "🔊 كتم المؤثرات"
            : "🔇 تفعيل المؤثرات";
          button.setAttribute("aria-pressed", String(sfxEnabled));
        }
      }
      function playSfx(name) {
        if (!sfxEnabled || !sfxContext) return;
        if (resultSounds[name]) {
          const audio = resultSounds[name];
          audio.currentTime = 0;
          audio.play().catch((error) => {
            console.error(`تعذر تشغيل مؤثر ${name}:`, error);
          });
          return;
        }
        const notes =
          {
            question: [
              [523.25, 0, 0.09],
              [783.99, 0.11, 0.13],
            ],
            options: [[740, 0, 0.07]],
            answer: [[659.25, 0, 0.14]],
            contestant: [[440, 0, 0.08]],
            rank: [[587.33, 0, 0.07]],
            reverse: [[880, 0, 0.06]],
          }[name] || [];
        for (const [frequency, delay, duration] of notes) {
          const start = sfxContext.currentTime + delay,
            oscillator = sfxContext.createOscillator(),
            gain = sfxContext.createGain();
          oscillator.type = "sine";
          oscillator.frequency.setValueAtTime(frequency, start);
          gain.gain.setValueAtTime(0.0001, start);
          gain.gain.exponentialRampToValueAtTime(0.055, start + 0.012);
          gain.gain.exponentialRampToValueAtTime(0.0001, start + duration);
          oscillator.connect(gain);
          gain.connect(sfxContext.destination);
          oscillator.start(start);
          oscillator.stop(start + duration + 0.02);
        }
      }
      function applyTutorialAudioState(audio, state) {
        if (!audio || !state) return;
        audio.muted = !!state.muted;
        if (Number.isFinite(state.volume))
          audio.volume = Math.max(0, Math.min(1, state.volume));
        if (
          audio.readyState >= 1 &&
          Number.isFinite(state.currentTime) &&
          Math.abs(audio.currentTime - state.currentTime) > 1
        )
          audio.currentTime = Math.min(
            state.currentTime,
            audio.duration || state.currentTime,
          );
        const enableButton = document.getElementById("enableScreenAudio");
        if (enableButton)
          enableButton.hidden = screenAudioUnlocked || !state.playing;
        if (state.playing) {
          if (screenAudioUnlocked && audio.paused) audio.play().catch(() => {});
        } else if (!audio.paused) audio.pause();
      }
      function enableScreenAudio() {
        screenAudioUnlocked = true;
        const audio = document.getElementById("screenTutorialAudio");
        const button = document.getElementById("enableScreenAudio");
        if (button) button.hidden = true;
        if (audio && V?.tutorialAudio?.playing)
          audio.play().catch(() => {
            if (button) button.hidden = false;
          });
      }
      function applyTutorialVideoState(video, state) {
        if (!video || !state) return;
        if (
          video.readyState >= 1 &&
          Number.isFinite(state.currentTime) &&
          Math.abs(video.currentTime - state.currentTime) > 1
        )
          video.currentTime = Math.min(
            state.currentTime,
            video.duration || state.currentTime,
          );
        const enableButton = document.getElementById("enableScreenVideo");
        if (enableButton)
          enableButton.hidden = !state.playing || screenVideoUnlocked;
        if (state.playing && video.paused && !screenVideoAutoplayBlocked)
          video.play().catch(() => {
            screenVideoAutoplayBlocked = true;
            if (enableButton) enableButton.hidden = false;
          });
        else if (!state.playing && !video.paused) video.pause();
      }
      function enableScreenVideo() {
        screenVideoUnlocked = true;
        const video = document.getElementById("screenTutorialVideo");
        const button = document.getElementById("enableScreenVideo");
        if (button) button.hidden = true;
        if (video && V?.tutorialVideo?.playing)
          video.play().catch(() => {
            screenVideoUnlocked = false;
            screenVideoAutoplayBlocked = true;
            if (button) button.hidden = false;
          });
      }
      function reverseStage(animateQuestion) {
        const letter = V.reverse?.letter,
          elapsed = Date.now() - (V.reverse?.started || 0),
          visible = !!letter && elapsed < 900;
        if (visible) reverseTimer = setTimeout(render, 905 - elapsed);
        return `<div class="tag ${animateQuestion ? "animate-in" : ""}">الكلمات المعكوسة</div>${visible ? `<div class="reverse-letter" dir="rtl">${esc(letter)}</div>` : `<div class="wait ${animateQuestion ? "animate-in" : ""}">اضغط عرض الحرف التالي من التابلت</div>`}`;
      }
      function visualStage(animateQuestion, animateAnswer) {
        if (!V.shown) return '<div class="wait">في انتظار السؤال...</div>';
        return `<div class="tag">${esc(V.t)}</div><div class="visual-clues ${animateQuestion ? "animate-options" : ""}">${V.image ? `<img class="visual-clue" src="${esc(V.image)}" alt="قرينة بصرية">` : ""}${V.emoji ? `<div class="visual-emoji">${esc(V.emoji)}</div>` : ""}</div>${V.ans ? `<div class="ans ${animateAnswer ? "animate-in" : ""}">✔ ${esc(V.ans)}</div>` : ""}`;
      }
      function statisticsStage() {
        const correct = V.stats?.correct || 0,
          wrong = V.stats?.wrong || 0,
          answered = correct + wrong,
          accuracy = answered ? Math.round((correct / answered) * 100) : 0;
        return `<div class="tag">📊 إحصائيات الإجابات</div><div class="screen-stats-summary"><div class="screen-stat screen-stat-correct"><span>إجابات صحيحة</span><b>${correct}</b></div><div class="screen-stat screen-stat-wrong"><span>إجابات خاطئة</span><b>${wrong}</b></div><div class="screen-stat"><span>إجمالي الإجابات</span><b>${answered}</b></div><div class="screen-stat"><span>نسبة الصحيح</span><b>${accuracy}%</b></div></div><div class="screen-stats-players">${V.cs.length ? V.cs.map((contestant) => { const playerCorrect = contestant.correct || 0, playerWrong = contestant.wrong || 0, playerTotal = playerCorrect + playerWrong, playerAccuracy = playerTotal ? Math.round((playerCorrect / playerTotal) * 100) : 0; return `<div class="screen-stat-player"><b>${esc(contestant.n)}</b><span class="screen-stat-correct">صح: ${playerCorrect}</span><span class="screen-stat-wrong">خطأ: ${playerWrong}</span><span>الإجمالي: ${playerTotal} · الصحيح: ${playerAccuracy}%</span></div>`; }).join("") : '<div class="wait">لا يوجد متسابقون مسجلون</div>'}</div>`;
      }
      function rouletteStage() {
        const roulette = V.roulette;
        if (!roulette?.frames?.length) return "";
        const elapsed = Math.max(0, Date.now() - roulette.started);
        if (elapsed >= roulette.duration) return "";
        let index = 0;
        while (
          index + 1 < roulette.frames.length &&
          roulette.frames[index + 1].at <= elapsed
        )
          index++;
        const frame = roulette.frames[index],
          nextAt = roulette.frames[index + 1]?.at ?? roulette.duration;
        rouletteTimer = setTimeout(render, Math.max(20, nextAt - elapsed));
        return `<div class="tag">${esc(frame.t)}</div><div class="card qbox roulette-question animate-in">${esc(frame.x)}</div>`;
      }
      function timerSeconds(timer) {
        return Math.ceil(timerRemaining(timer) / 1000);
      }
      function timerRemaining(timer) {
        return Math.max(
          0,
          timer.paused
            ? timer.remaining
            : timer.deadline - Math.max(Date.now(), timer.startedAt || 0),
        );
      }
      function timerProgress(timer) {
        return Math.min(100, (timerRemaining(timer) / 30000) * 100);
      }
      function updateTimerDisplay() {
        const timer = V?.timer;
        const display = document.getElementById("screenTimerCountdown");
        if (display && timer) {
          const seconds = timerSeconds(timer);
          display.textContent = seconds;
          display
            .closest(".game-timer")
            .classList.toggle("timer-ending", seconds <= 5);
          const progress = document.getElementById("screenTimerProgress");
          if (progress) progress.style.width = `${timerProgress(timer)}%`;
        }
      }
      function playQuestionAudio() {
        const audio = document.getElementById("questionAudioPlayer");
        const button = document.getElementById("playQuestionAudio");
        if (audio) {
          audio.dataset.remotePaused = "false";
          audio.play().then(
            () => {
              if (button) button.hidden = true;
            },
            () => {
              if (button) button.hidden = false;
            },
          );
        }
      }
      function applyQuestionAudioControl(audio, button, control, questionKey) {
        if (!audio || !control) return;
        if (Number.isFinite(control.volume))
          audio.volume = Math.max(0, Math.min(1, control.volume));
        if (!control.seq) return;
        const commandKey = `${questionKey}|${control.seq}`;
        if (commandKey === lastQuestionAudioControlKey) return;
        lastQuestionAudioControlKey = commandKey;
        const run = () => {
          if (control.action === "pause") {
            audio.dataset.remotePaused = "true";
            audio.pause();
            return;
          }
          if (control.action === "restart") {
            audio.dataset.remotePaused = "false";
            if (audio.readyState >= 1) {
              audio.currentTime = 0;
              playQuestionAudio();
            } else
              audio.addEventListener(
                "loadedmetadata",
                () => {
                  audio.currentTime = 0;
                  playQuestionAudio();
                },
                { once: true },
              );
            return;
          }
          if (control.action === "play") {
            audio.dataset.remotePaused = "false";
            playQuestionAudio();
          }
        };
        run();
      }
      function render() {
        if (!V) return;
        clearTimeout(rouletteTimer);
        const activeAudio = document.getElementById("screenTutorialAudio");
        if (V.tutorialPlaying && activeAudio) {
          document.querySelector(".board").innerHTML = board(V.cs);
          applyTutorialAudioState(activeAudio, V.tutorialAudio);
          return;
        }
        const activeVideo = document.getElementById("screenTutorialVideo");
        if (V.tutorialVideoPlaying && activeVideo) {
          document.querySelector(".board").innerHTML = board(V.cs);
          applyTutorialVideoState(activeVideo, V.tutorialVideo);
          return;
        }
        clearTimeout(reverseTimer);
        const b = V.buz != null ? V.cs[V.buz] : null,
          cu = V;
        const questionContent =
            V.mode === "visual"
              ? `${V.image || ""}|${V.emoji || ""}`
              : V.mode === "audio"
                ? `${V.audioUrl || ""}|${V.x || ""}`
              : V.x || "",
          questionKey = V.shown
            ? V.mode === "reverse" && V.displayId
              ? `reverse|${V.displayId}`
              : V.mode === "quiz" || V.mode === "visual" || V.mode === "audio"
                ? `${V.mode}|${V.t}|${questionContent}|${V.displayId || ""}`
                : ""
            : "",
          animateQuestion = !!questionKey && questionKey !== lastQuestionKey;
        const optionsKey = V.o ? `${questionKey}|${V.o.join("|")}` : "",
          animateOptions = !!optionsKey && optionsKey !== lastOptionsKey,
          answerKey = V.ans ? `${questionKey}|${V.ans}` : "",
          animateAnswer = !!answerKey && answerKey !== lastAnswerKey,
          revealedRanks = lastTop5Key === questionKey ? lastRevealedRanks : [];
        const resultKey = V.res ? `${questionKey}|${V.res}` : "",
          buzzKey = V.buz == null ? "" : `${questionKey}|${V.buz}`,
          newRanks =
            V.mode === "quiz" &&
            (V.kind === "top5" || V.kind === "top10")
              ? (V.revealed || []).filter(
                  (a) => !revealedRanks.includes(a.rank),
                )
              : [],
          reverseLetter = V.mode === "reverse" ? V.reverse?.letter || "" : "";
        if (animateQuestion) playSfx("question");
        if (animateOptions) playSfx("options");
        if (V.res === "ok" && resultKey !== lastResultKey) playSfx("correct");
        else if (V.res === "no" && resultKey !== lastResultKey)
          playSfx("wrong");
        else if (animateAnswer) playSfx("answer");
        if (buzzKey && buzzKey !== lastBuzzKey) playSfx("contestant");
        newRanks.forEach(() => playSfx("rank"));
        if (reverseLetter && reverseLetter !== lastReverseLetter)
          playSfx("reverse");
        const rouletteHtml = V.shown ? rouletteStage() : "";
        const previousQuestionAudio = document.getElementById(
          "questionAudioPlayer",
        );
        const keepQuestionAudio =
          previousQuestionAudio?.dataset.questionKey === questionKey;
        const questionAudioTime = keepQuestionAudio
          ? previousQuestionAudio.currentTime
          : 0;
        const questionAudioWasPlaying =
          keepQuestionAudio && !previousQuestionAudio.paused;
        document.getElementById("app").innerHTML =
          `<button id="screenSfxToggle" class="screen-sfx-toggle ${sfxEnabled ? "on" : ""}" aria-pressed="${sfxEnabled}" onclick="toggleSfx()">${sfxEnabled ? "🔊 كتم المؤثرات" : "🔇 تفعيل المؤثرات"}</button><div class="scr"><div class="stage">
${
  V.tutorialVideoPlaying
    ? `<div class="tag">الفيديو التوضيحي</div><button id="enableScreenVideo" class="on" onclick="enableScreenVideo()" hidden>تشغيل الفيديو على الشاشة</button><video id="screenTutorialVideo" class="tutorial-video-player" playsinline preload="auto"><source src="/tutorial.mp4" type="video/mp4"></video>`
    : V.tutorialPlaying
    ? `<div class="tag">الصوت التوضيحي</div><button id="enableScreenAudio" class="on" onclick="enableScreenAudio()" hidden>السماح بتشغيل صوت التابلت</button><audio id="screenTutorialAudio" class="tutorial-audio-player" controls preload="auto"><source src="/tutorial.wav" type="audio/wav"></audio>`
    : V.showStats
      ? statisticsStage()
      : rouletteHtml
      ? rouletteHtml
      : V.mode === "reverse"
      ? reverseStage(animateQuestion)
      : V.mode === "visual"
        ? visualStage(animateQuestion, animateAnswer)
        : V.shown
          ? `<div class="tag">${esc(V.t)} · ${V.kind === "top5" || V.kind === "top10" ? "النقاط حسب الترتيب" : V.d === "h" ? "صعب — نقطتان" : "سهل — نقطة"}</div><div class="card qbox ${animateQuestion ? "animate-in" : ""}">${esc(V.x)}</div>
 ${V.mode === "audio" ? `<button id="playQuestionAudio" class="on" onclick="playQuestionAudio()" hidden>▶ تشغيل الصوت</button><audio id="questionAudioPlayer" class="question-audio-player" controls preload="metadata" data-question-key="${esc(questionKey)}" onerror="this.nextElementSibling.hidden=false"><source src="${esc(V.audioUrl)}"></audio><small hidden>تعذر تحميل الرابط الصوتي، تأكد من أنه رابط مباشر لملف صوتي.</small>` : ""}
 ${V.kind === "top5" || V.kind === "top10" ? V.revealed?.length ? `<div class="opts">${V.revealed.map((a) => `<div class="opt ok ${revealedRanks.includes(a.rank) ? "" : "animate-in"}"><b>${a.rank}</b>${esc(a.a)}</div>`).join("")}</div>` : "" : ""}
 ${V.o ? `<div class="opts ${animateOptions ? "animate-options" : ""}">${V.o.map((o, i) => `<div class="opt ${V.c === i ? "ok" : ""}"><b>${LB[i]}</b>${esc(o)}</div>`).join("")}</div>` : ""}
 ${V.ans ? `<div class="ans ${animateAnswer ? "animate-in" : ""}">✔ ${esc(V.ans)}</div>` : ""}`
          : '<div class="wait">في انتظار السؤال...</div>'
}
 ${!V.showStats && V.timer && V.timer.phase !== "done" ? `<div class="game-timer ${timerSeconds(V.timer) <= 5 ? "timer-ending" : ""}"><div class="timer-readout"><span>${V.timer.phase === "question" ? "السؤال" : "الاختيارات"}${V.timer.paused ? " · متوقف" : ""}</span><b id="screenTimerCountdown">${timerSeconds(V.timer)}</b><small>ثانية</small></div><div class="timer-track"><i id="screenTimerProgress" style="width:${timerProgress(V.timer)}%"></i></div></div>` : ""}
 ${!V.showStats && V.mode !== "reverse" && b ? `<div class="buz">🔔 ${esc(b.n)} · ${b.s} نقطة ${V.res === "ok" ? "✅" : V.res === "no" ? "❌" : ""}</div>` : ""}</div>
 <div class="card" style="align-self:start"><h3>🏆 الترتيب</h3><div class="board">${board(V.cs)}</div></div></div>`;
        if (!V.showStats && V.mode === "audio" && V.shown) {
          const audio = document.getElementById("questionAudioPlayer"),
            button = document.getElementById("playQuestionAudio"),
            shouldPlay = keepQuestionAudio
              ? questionAudioWasPlaying
              : questionKey !== lastQuestionAudioKey;
          const restoreAndPlay = () => {
            if (
              keepQuestionAudio &&
              Number.isFinite(questionAudioTime) &&
              questionAudioTime < audio.duration
            )
              audio.currentTime = questionAudioTime;
            if (shouldPlay && audio.dataset.remotePaused !== "true")
              audio.play().catch(() => {
                if (button) button.hidden = false;
              });
          };
          if (audio.readyState >= 1) restoreAndPlay();
          else
            audio.addEventListener("loadedmetadata", restoreAndPlay, {
              once: true,
            });
          audio.addEventListener("play", () => {
            if (button) button.hidden = true;
          });
          audio.addEventListener("pause", () => {
            if (button) button.hidden = false;
          });
          if (button) button.hidden = !audio.paused && !audio.ended;
          applyQuestionAudioControl(audio, button, V.audioControl, questionKey);
          lastQuestionAudioKey = questionKey;
        } else {
          lastQuestionAudioKey = "";
          lastQuestionAudioControlKey = "";
        }
        lastQuestionKey = questionKey;
        lastOptionsKey = optionsKey;
        lastAnswerKey = answerKey;
        lastTop5Key = questionKey;
        lastRevealedRanks =
          V.mode === "quiz" &&
          (V.kind === "top5" || V.kind === "top10")
            ? (V.revealed || []).map((a) => a.rank)
            : [];
        lastResultKey = resultKey;
        lastBuzzKey = buzzKey;
        lastReverseLetter = reverseLetter;
        if (V.tutorialVideoPlaying) {
          const video = document.getElementById("screenTutorialVideo");
          video.addEventListener(
            "loadedmetadata",
            () => applyTutorialVideoState(video, V.tutorialVideo),
            { once: true },
          );
          video.addEventListener(
            "error",
            () => {
              const button = document.getElementById("enableScreenVideo");
              if (button) {
                button.hidden = false;
                button.textContent = "تعذر تحميل الفيديو على الشاشة";
              }
            },
            { once: true },
          );
          if (video.readyState >= 1)
            applyTutorialVideoState(video, V.tutorialVideo);
        }
        if (V.tutorialPlaying) {
          const audio = document.getElementById("screenTutorialAudio");
          audio.addEventListener(
            "play",
            () => {
              screenAudioUnlocked = true;
              const button = document.getElementById("enableScreenAudio");
              if (button) button.hidden = true;
            },
            { once: true },
          );
          audio.addEventListener(
            "loadedmetadata",
            () => {
              const state = V.tutorialAudio;
              if (
                state &&
                Number.isFinite(state.currentTime) &&
                state.currentTime < audio.duration
              )
                audio.currentTime = state.currentTime;
              applyTutorialAudioState(audio, state);
            },
            { once: true },
          );
          if (audio.readyState >= 1)
            applyTutorialAudioState(audio, V.tutorialAudio);
          if (V.tutorialAudio?.playing && !screenAudioUnlocked) {
            const button = document.getElementById("enableScreenAudio");
            if (button) button.hidden = false;
          }
        }
      }
      setInterval(updateTimerDisplay, 200);
      if (room) connectView(room, render);
      else
        document.getElementById("app").innerHTML =
          '<div class="home"><h1>افتح رابط الشاشة من التابلت</h1></div>';
    </script>
     <footer class="site-footer">
        <p>جميع الحقوق محفوظة <a href="https://abdelrhman333e-web.vercel.app/" target="_blank" rel="noreferrer">abdo</a> &copy; 2026</p>
    </footer>
  </body>
</html>
