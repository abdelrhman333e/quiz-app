<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/style.css"><title>شاشة العرض</title></head>
<body><div id="app"></div><script src="/common.js"></script><script>
const room=location.pathname.split('/')[2];
let reverseTimer;
function reverseStage(){const word=Array.from(V.reverse?.word||'').reverse(),elapsed=Date.now()-(V.reverse?.started||0),shown=word.length*800;
 if(elapsed<shown){const count=Math.min(word.length,Math.floor(elapsed/800)+1);reverseTimer=setTimeout(render,(count*800-elapsed)+5);return `<div class="tag">الكلمات المعكوسة</div><div class="reverse-word" dir="rtl">${word.slice(0,count).map(c=>`<span>${esc(c)}</span>`).join('')}</div>`}
 if(elapsed<shown+1000){reverseTimer=setTimeout(render,shown+1005-elapsed);return `<div class="tag">الكلمات المعكوسة</div><div class="reverse-word" aria-hidden="true"></div>`}
 return `<div class="tag">الكلمات المعكوسة</div><div class="reverse-word" aria-hidden="true"></div>`}
function render(){if(!V)return;clearTimeout(reverseTimer);const b=V.buz!=null?V.cs[V.buz]:null,cu=V;
 document.getElementById('app').innerHTML=`<div class="scr"><div class="stage">
 ${V.mode==='reverse'?reverseStage():V.shown?`<div class="tag">${esc(V.t)} · ${V.kind==='top5'?'النقاط حسب الترتيب':V.d==='h'?'صعب — نقطتان':'سهل — نقطة'}</div><div class="card qbox">${esc(V.x)}</div>
 ${V.kind==='top5'&&V.revealed?.length?`<div class="opts">${V.revealed.map(a=>`<div class="opt ok"><b>${a.rank}</b>${esc(a.a)}</div>`).join('')}</div>`:''}
 ${V.o?`<div class="opts">${V.o.map((o,i)=>`<div class="opt ${V.c===i?'ok':''}"><b>${LB[i]}</b>${esc(o)}</div>`).join('')}</div>`:''}
 ${V.ans?`<div class="ans">✔ ${esc(V.ans)}</div>`:''}`:'<div class="wait">في انتظار السؤال...</div>'}
 ${V.mode!=='reverse'&&b?`<div class="buz">🔔 ${esc(b.n)} · ${b.s} نقطة ${V.res==='ok'?'✅':V.res==='no'?'❌':''}</div>`:''}</div>
 <div class="card" style="align-self:start"><h3>🏆 الترتيب</h3><div class="board">${board(V.cs)}</div></div></div>`}
if(room)connectView(room,render);else document.getElementById('app').innerHTML='<div class="home"><h1>افتح رابط الشاشة من التابلت</h1></div>';
</script></body></html>
