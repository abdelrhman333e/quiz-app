<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#0b1425" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="stylesheet" href="/style.css?v=23" />
    <title>تابلت التحكم</title>
  </head>
  <body>
    <div id="app"></div>
    <div id="form"></div>
    <div id="videoModal"></div>
    <div id="confirmModal"></div>
    <div id="statsModal"></div>
    <script src="/common.js"></script>
    <script>
      const $ = (id) => document.getElementById(id);
      const pts = (q) => PT[q.d];
      function types() {
        return [...new Set(Qs.map((q) => q.t))];
      }
      function render() {
        if (!G) return;
        if (!G.stats || typeof G.stats !== "object")
          G.stats = { correct: 0, wrong: 0 };
        G.stats.correct = Number.isSafeInteger(G.stats.correct)
          ? Math.max(0, G.stats.correct)
          : 0;
        G.stats.wrong = Number.isSafeInteger(G.stats.wrong)
          ? Math.max(0, G.stats.wrong)
          : 0;
        G.cs.forEach((contestant) => {
          contestant.correct = Number.isSafeInteger(contestant.correct)
            ? Math.max(0, contestant.correct)
            : 0;
          contestant.wrong = Number.isSafeInteger(contestant.wrong)
            ? Math.max(0, contestant.wrong)
            : 0;
        });
        if (G.cur.q && !G.cur.timer && timerEnabled(cq())) {
          startQuestionTimer(cq());
          G.v = Date.now();
          api("/api/game", "POST", G).catch(() =>
            toast("تعذر الاتصال بالسيرفر", 1),
          );
        }
        const T = ["الكل", ...types()],
          list = Qs.filter((q) => G.f === "الكل" || q.t === G.f),
          q = cq(),
          cu = G.cur,
          hasO = q?.o?.length,
          top = q?.kind === "top5" || q?.kind === "top10",
          reverse = q?.kind === "reverse",
          visual = q?.kind === "visual",
          audioQuestion = q?.kind === "audio",
          reverseCount = reverse ? Array.from(q.a || "").length : 0,
          reverseIndex = cu.rev?.index || 0,
          timer = cu.timer,
          timerActive = timer && timer.phase !== "done";
        $("app").innerHTML =
          `<div class="tb"><div class="card"><h3>نوع السؤال</h3>
 <div class="row">${T.map((t, i) => `<button class="${G.f === t ? "on" : ""}" onclick="setF(${i})">${esc(t)}</button>`).join("")}</div>
 <div class="row"><button onclick="rndQ()"><img class="action-icon" src="/random.svg" alt=""> سؤال عشوائي</button><button onclick="openForm()">＋ سؤال جديد</button><button onclick="exportQuestions()">⬇️ تصدير الأسئلة</button><button onclick="$('importQuestionsFile').click()">⬆️ استيراد أسئلة</button><input id="importQuestionsFile" type="file" accept=".json,.txt,.xlsx,.docx,application/json,text/plain,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,application/vnd.openxmlformats-officedocument.wordprocessingml.document" hidden onchange="handleQuestionsImport(this)"><button onclick="openTutorialAudio()">🔊 الصوت التوضيحي</button><button onclick="openTutorialVideo()">🎬 الفيديو التوضيحي</button></div>
 <small class="import-hint">استيراد: نسخة JSON، أو TXT/Word (DOCX) بأسطر معنونة، أو Excel (XLSX) بصف عناوين: التصنيف، السؤال، الصعوبة، الاختيار أ، الاختيار ب، الاختيار ج، الاختيار د، الإجابة.</small><details class="import-hint"><summary>عرض مثال لملف TXT أو Word</summary><div dir="rtl">التصنيف: ثقافة عامة<br>السؤال: ما عاصمة مصر؟<br>الصعوبة: سهل<br>الاختيار أ: القاهرة<br>الاختيار ب: الإسكندرية<br>الاختيار ج: الجيزة<br>الاختيار د: الأقصر<br>الإجابة: أ</div><small>افصل كل سؤال عن التالي بسطر فارغ. يمكن ترك الاختيارات والصعوبة فارغة؛ والإجابة تكون نصًا إن لم توجد اختيارات.</small></details>
 <div class="qs">${list.map((x) => `<div class="qi ${x.id === cu.id ? "sel" : ""}" onclick="sel('${x.id}')">${x.kind === "reverse" ? "🔁" : x.d === "h" ? "🔴" : "🟢"} ${esc(x.x)}</div>`).join("") || "<small>لا توجد أسئلة</small>"}</div>
 <h3 style="margin-top:14px">معاينة — لا تظهر على الشاشة</h3>
 ${
   q
     ? `<div style="font-size:18px"><b>${esc(q.x)}</b> <small>(${esc(q.t)} · ${pts(q)} نقطة)</small></div>
 ${visual ? `<div class="visual-preview">${q.image ? `<img src="${esc(q.image)}" alt="قرينة الصورة">` : ""}${q.emoji ? `<span>${esc(q.emoji)}</span>` : ""}<div style="color:var(--ok)">الإجابة: ${esc(q.a)}</div></div>` : audioQuestion ? `<div class="visual-preview"><audio controls preload="none" src="${esc(q.audioUrl)}"></audio></div>${hasO ? q.o.map((o, i) => `<div style="${q.c === i ? "color:var(--ok);font-weight:700" : ""}">${LB[i]}) ${esc(o)}</div>`).join("") : `<div style="color:var(--ok)">الإجابة: ${esc(q.a)}</div>`}` : reverse ? `<div style="color:var(--ok)">الكلمة: ${esc(q.a)}</div>` : top ? q.r.map((a, i) => `<div style="${cu.revealed?.includes(i) ? "color:var(--ok);font-weight:700" : ""}">${i + 1}. ${esc(a)}</div>`).join("") : hasO ? q.o.map((o, i) => `<div style="${q.c === i ? "color:var(--ok);font-weight:700" : ""}">${LB[i]}) ${esc(o)}</div>`).join("") : `<div style="color:var(--ok)">الإجابة: ${esc(q.a)}</div>`}
 <div class="row">${
   reverse
     ? `<button class="big2 on" onclick="nextReverseLetter()" ${reverseIndex >= reverseCount ? "disabled" : ""}>${reverseIndex >= reverseCount ? "اكتملت الحروف" : `إظهار الحرف التالي (${reverseIndex + 1}/${reverseCount})`}</button><button class="big2" onclick="resetReverse()">ابدأ من جديد</button>`
     : `<button class="big2 ${cu.q ? "on" : ""}" onclick="tg('q')">${cu.q ? "إخفاء" : "عرض"} السؤال</button>
 ${top ? q.r.map((a, i) => `<button class="big2 ${cu.revealed?.includes(i) ? "on" : ""}" onclick="revealRank(${i})">${cu.revealed?.includes(i) ? "تم كشف" : "كشف"} رقم ${i + 1}</button>`).join("") : ""}
 ${hasO ? `<button class="big2 ${cu.o ? "on" : ""}" onclick="tg('o')">${cu.o ? "إخفاء" : "عرض"} الاختيارات</button>` : ""}
 ${top ? "" : `<button class="big2 ${cu.a ? "on" : ""}" onclick="tg('a')">${cu.a ? "إخفاء" : "عرض"} الإجابة</button>`}`
 }</div>
 ${audioQuestion ? `<div class="audio-control-panel"><h3>التحكم في صوت السؤال</h3><div class="row"><button class="big2 on" onclick="setQuestionAudio(${cu.audioControl?.playing === false ? "'play'" : "'pause'"})">${cu.audioControl?.playing === false ? "▶ تشغيل الصوت" : "⏸ إيقاف مؤقت"}</button><button class="big2" onclick="setQuestionAudio('restart')">↺ إعادة من البداية</button></div><label for="questionAudioVolume">مستوى الصوت: <span id="questionAudioVolumeValue">${Math.round((cu.audioControl?.volume ?? 1) * 100)}%</span></label><input id="questionAudioVolume" type="range" min="0" max="100" value="${Math.round((cu.audioControl?.volume ?? 1) * 100)}" oninput="$('questionAudioVolumeValue').textContent=this.value+'%'" onchange="setQuestionAudio('volume',this.value/100)"><small>إذا منع المتصفح التشغيل عن بُعد، اضغط تشغيل على شاشة العرض مرة واحدة.</small></div>` : ""}
 ${timer ? `<div class="timer-controls"><div class="game-timer"><div class="timer-readout"><span>${timerPhaseLabel(timer.phase)}${timer.paused ? " · متوقف" : ""}</span><b id="tabletTimerCountdown">${timerSeconds(timer)}</b><small>ثانية</small></div><div class="timer-track"><i id="tabletTimerProgress" style="width:${timerProgress(timer)}%"></i></div></div><button onclick="${timerActive ? "toggleTimer()" : "restartTimer()"}">${timerActive ? timer.paused ? "▶ استكمال المؤقت" : "⏸ إيقاف المؤقت" : "↻ إعادة المؤقت"}</button>${timerActive ? `<button onclick="restartTimer()">↻ إعادة 30 ثانية</button>` : ""}</div>` : ""}
 <h3>من جاوب؟</h3><div class="row">${G.cs.map((c, i) => `<button class="${cu.buz === i ? "on" : ""}" onclick="buz(${i})">${esc(c.n)}</button>`).join("") || "<small>أضف متسابقين</small>"}</div>
 ${cu.buz != null ? `<div class="row">${top && cu.rank == null ? "<small>اكشف ترتيب الإجابة لتسجيل نقاطها</small>" : `<button class="big2 ok" onclick="grade(1${top ? `,${cu.rank}` : ""})">✅ صح (+${top ? cu.rank + 1 : pts(q)})</button>`}<button class="big2 no" onclick="grade(0)">❌ غلط (−1)</button></div>` : ""}
 <div class="row"><button class="action-btn" onclick="openForm('${q.id}')"><img class="action-icon" src="/edit-svgrepo-com.svg" alt=""> تعديل</button><button class="action-btn" onclick="del('${q.id}')"><img class="action-icon" src="/icons8-trash.svg" alt=""> حذف</button></div>`
     : "<small>اختر سؤالًا أو اضغط عشوائي</small>"
 }</div>
 <div class="card"><h3>المتسابقون · ${esc(ME.u)}</h3><div class="row"><input id="cn" placeholder="اسم المتسابق" style="flex:1;width:auto"><button onclick="addC()">＋</button></div>
 ${G.cs.map((c, i) => `<div class="ct"><b>${esc(c.n)}</b> — ${c.s}<div class="row"><button onclick="ch(${i},'s',1)">＋</button><button onclick="ch(${i},'s',-1)">−</button><button onclick="ch(${i},'y',1)">🟨 ${c.y}</button><button onclick="ch(${i},'r',1)">🟥 ${c.r}</button><button class="contestant-delete" title="حذف المتسابق" aria-label="حذف المتسابق" onclick="ch(${i},'x')"><img class="action-icon" src="/icons8-trash.svg" alt=""></button></div></div>`).join("")}
 <div class="row"><button onclick="showStats()">📊 الإحصائيات</button><button onclick="resetScores()">تصفير النقاط</button><button onclick="copyLink()">📺 نسخ رابط الشاشة</button><button onclick="logout()">🚪 خروج</button></div></div></div>`;
      }
      const TIMER_DURATION = 30000;
      function timerEnabled(q) {
        return q && ["normal", "visual", "audio", "top5", "top10"].includes(q.kind);
      }
      function timerPhaseLabel(phase) {
        return phase === "question"
          ? "وقت السؤال"
          : phase === "options"
            ? "وقت الاختيارات"
            : "وقت الإجابة";
      }
      function timerSeconds(timer) {
        return Math.ceil(timerRemaining(timer) / 1000);
      }
      function timerRemaining(timer) {
        return Math.max(
          0,
          timer.paused
            ? timer.remaining
            : timer.deadline - Math.max(Date.now(), timer.startedAt || 0),
        );
      }
      function timerProgress(timer) {
        return Math.min(100, (timerRemaining(timer) / TIMER_DURATION) * 100);
      }
      function updateTimerDisplay() {
        const timer = G?.cur?.timer;
        const display = $("tabletTimerCountdown");
        if (display && timer) {
          const seconds = timerSeconds(timer);
          display.textContent = seconds;
          display
            .closest(".game-timer")
            .classList.toggle("timer-ending", seconds <= 5);
          const progress = $("tabletTimerProgress");
          if (progress) progress.style.width = `${timerProgress(timer)}%`;
        }
      }
      function startQuestionTimer(q, startedAt = Date.now()) {
        G.cur.timer = timerEnabled(q)
          ? {
              phase: "question",
              startedAt,
              deadline: startedAt + TIMER_DURATION,
              remaining: TIMER_DURATION,
              paused: false,
            }
          : null;
      }
      function advanceTimer() {
        const timer = G?.cur?.timer;
        if (!timer || timer.paused || timer.phase === "done") return;
        const q = cq();
        let changed = false;
        while (timer.phase !== "done" && Date.now() >= timer.deadline) {
          if (
            timer.phase === "question" &&
            ["normal", "audio"].includes(q?.kind) &&
            q.o?.length
          ) {
            G.cur.o = 1;
            timer.phase = "options";
          } else if (["top5", "top10"].includes(q?.kind)) {
            G.cur.revealed = Array.from(
              { length: q.r.length },
              (_, index) => index,
            );
            G.cur.a = 1;
            timer.phase = "done";
          } else {
            G.cur.a = 1;
            timer.phase = "done";
          }
          timer.startedAt = timer.deadline;
          timer.deadline += TIMER_DURATION;
          timer.remaining = TIMER_DURATION;
          changed = true;
        }
        if (changed) save();
        else updateTimerDisplay();
      }
      function toggleTimer() {
        const timer = G?.cur?.timer;
        if (!timer || timer.phase === "done") return;
        if (timer.paused) {
          timer.startedAt = Date.now();
          timer.deadline = timer.startedAt + timer.remaining;
          timer.paused = false;
        } else {
          timer.remaining = Math.max(
            0,
            timer.deadline - Math.max(Date.now(), timer.startedAt || 0),
          );
          timer.paused = true;
        }
        save();
      }
      function restartTimer() {
        const q = cq();
        if (!timerEnabled(q)) return;
        const timer = G.cur.timer;
        if (timer && timer.phase !== "done") {
          timer.startedAt = Date.now();
          timer.deadline = timer.startedAt + TIMER_DURATION;
          timer.remaining = TIMER_DURATION;
          timer.paused = false;
        } else {
          G.cur.q = 1;
          G.cur.o = 0;
          G.cur.a = 0;
          startQuestionTimer(q);
        }
        save();
      }
      function save() {
        G.v = Date.now();
        render();
        api("/api/game", "POST", G).catch(() =>
          toast("تعذر الاتصال بالسيرفر", 1),
        );
      }
      function setQuestionAudio(action, volume = null) {
        const current = G?.cur?.audioControl || {
          seq: 0,
          playing: true,
          volume: 1,
        };
        G.cur.audioControl = {
          seq: (current.seq || 0) + 1,
          action,
          playing:
            action === "pause"
              ? false
              : action === "play" || action === "restart"
                ? true
                : current.playing !== false,
          volume:
            action === "volume"
              ? Math.max(0, Math.min(1, Number(volume)))
              : current.volume ?? 1,
        };
        save();
      }
      function toast(m, bad) {
        const d = document.createElement("div");
        d.className = "toast";
        if (bad) d.style.background = "var(--no)";
        d.textContent = m;
        document.body.append(d);
        setTimeout(() => d.remove(), 2000);
      }
      let tutorialAudioSyncAt = 0;
      let tutorialVideoSyncAt = 0;
      function publishTutorialAudioState(force = false) {
        const audio = $("videoModal").querySelector("audio");
        if (!audio || !G.tutorialPlaying) return;
        const now = Date.now();
        if (!force && now - tutorialAudioSyncAt < 600) return;
        tutorialAudioSyncAt = now;
        G.tutorialAudio = {
          playing: !audio.paused && !audio.ended,
          muted: audio.muted || audio.volume === 0,
          volume: audio.volume,
          currentTime: audio.currentTime,
        };
        updateTutorialAudioControls();
        G.v = now;
        api("/api/game", "POST", G).catch(() =>
          toast("تعذر إرسال حالة الصوت للشاشة", 1),
        );
      }
      function updateTutorialAudioControls() {
        const audio = $("tutorialAudioPlayer");
        if (!audio) return;
        const button = $("tutorialAudioToggle");
        if (button)
          button.textContent = audio.paused
            ? "▶ تشغيل الصوت"
            : "⏸ إيقاف مؤقت";
        const volume = $("tutorialAudioVolume");
        if (volume) {
          volume.value = Math.round(audio.volume * 100);
          $("tutorialAudioVolumeValue").textContent = `${volume.value}%`;
        }
      }
      function controlTutorialAudio(action, volume = null) {
        const audio = $("tutorialAudioPlayer");
        if (!audio) return;
        if (action === "pause") {
          audio.pause();
          publishTutorialAudioState(true);
          return;
        }
        if (action === "volume") {
          audio.volume = Math.max(0, Math.min(1, Number(volume)));
          audio.muted = audio.volume === 0;
          publishTutorialAudioState(true);
          return;
        }
        if (action === "restart") audio.currentTime = 0;
        audio.play().then(
          () => publishTutorialAudioState(true),
          () => toast("تعذر تشغيل الصوت التوضيحي؛ تحقق من تحميله", 1),
        );
      }
      function publishTutorialVideoState(force = false) {
        const video = $("videoModal").querySelector("video");
        if (!video || !G.tutorialVideoPlaying) return;
        const now = Date.now();
        if (!force && now - tutorialVideoSyncAt < 600) return;
        tutorialVideoSyncAt = now;
        G.tutorialVideo = {
          playing: !video.paused && !video.ended,
          currentTime: video.currentTime,
        };
        G.v = now;
        api("/api/game", "POST", G).catch(() =>
          toast("تعذر إرسال حالة الفيديو للشاشة", 1),
        );
      }
      function openTutorialAudio() {
        G.tutorialVideoPlaying = false;
        const video = $("tutorialVideoPlayer");
        if (video) video.pause();
        G.tutorialPlaying = true;
        G.tutorialStarted = Date.now();
        G.tutorialAudio = {
          playing: false,
          muted: false,
          volume: 1,
          currentTime: 0,
        };
        save();
        $("videoModal").innerHTML =
          `<div class="modal" onclick="if(event.target===this)closeTutorialAudio()"><div class="card audio-card"><div class="row" style="justify-content:space-between"><h3>الصوت التوضيحي</h3><button onclick="closeTutorialAudio()">إغلاق</button></div><audio id="tutorialAudioPlayer" class="tutorial-audio-player" preload="auto" onerror="$('audioMissing').hidden=false"><source src="/tutorial.wav" type="audio/wav"></audio><div class="audio-control-panel"><div class="row"><button id="tutorialAudioToggle" class="big2 on" onclick="controlTutorialAudio($('tutorialAudioPlayer').paused?'play':'pause')">▶ تشغيل الصوت</button><button class="big2" onclick="controlTutorialAudio('restart')">↺ إعادة من البداية</button></div><label for="tutorialAudioVolume">مستوى الصوت: <span id="tutorialAudioVolumeValue">100%</span></label><input id="tutorialAudioVolume" type="range" min="0" max="100" value="100" oninput="$('tutorialAudioVolumeValue').textContent=this.value+'%'" onchange="controlTutorialAudio('volume',this.value/100)"></div><small id="audioMissing" hidden>تعذر تحميل ملف الصوت tutorial.wav</small></div></div>`;
        const audio = $("tutorialAudioPlayer");
        ["play", "pause", "seeked", "volumechange", "ended"].forEach((event) =>
          audio.addEventListener(event, () => {
            updateTutorialAudioControls();
            publishTutorialAudioState(true);
          }),
        );
        audio.addEventListener("timeupdate", () => publishTutorialAudioState());
        updateTutorialAudioControls();
        audio.play().catch(() => {});
      }
      function closeTutorialAudio() {
        const audio = $("tutorialAudioPlayer");
        G.tutorialPlaying = false;
        G.tutorialStarted = 0;
        if (audio) {
          audio.pause();
          G.tutorialAudio = {
            playing: false,
            muted: audio.muted || audio.volume === 0,
            volume: audio.volume,
            currentTime: audio.currentTime,
          };
        }
        save();
        $("videoModal").innerHTML = "";
      }
      function openTutorialVideo() {
        G.tutorialPlaying = false;
        const audio = $("tutorialAudioPlayer");
        if (audio) audio.pause();
        G.tutorialVideoPlaying = true;
        G.tutorialVideo = { playing: false, currentTime: 0 };
        save();
        $("videoModal").innerHTML =
          `<div class="modal" onclick="if(event.target===this)closeTutorialVideo()"><div class="card tutorial-video-card"><div class="row" style="justify-content:space-between"><h3>الفيديو التوضيحي</h3><button onclick="closeTutorialVideo()">إغلاق</button></div><video id="tutorialVideoPlayer" class="tutorial-video-player" controls playsinline preload="metadata" onerror="$('videoMissing').hidden=false"><source src="/tutorial.mp4" type="video/mp4"></video><small id="videoMissing" hidden>تعذر تحميل ملف الفيديو tutorial.mp4</small></div></div>`;
        const videoPlayer = $("tutorialVideoPlayer");
        ["play", "pause", "seeked", "ended"].forEach((event) =>
          videoPlayer.addEventListener(event, () =>
            publishTutorialVideoState(true),
          ),
        );
        videoPlayer.addEventListener("timeupdate", () =>
          publishTutorialVideoState(),
        );
        videoPlayer.play().catch(() => toast("اضغط تشغيل لبدء الفيديو"));
      }
      function closeTutorialVideo() {
        const video = $("tutorialVideoPlayer");
        G.tutorialVideoPlaying = false;
        if (video) {
          G.tutorialVideo = {
            playing: false,
            currentTime: video.currentTime,
          };
          video.pause();
        }
        save();
        $("videoModal").innerHTML = "";
      }
      function setF(i) {
        G.f = ["الكل", ...types()][i];
        save();
      }
      function rndQ() {
        const l = Qs.filter((q) => G.f === "الكل" || q.t === G.f);
        if (!l.length) return;
        let f = l.filter((q) => !G.used.includes(q.id));
        if (!f.length) {
          G.used = G.used.filter((id) => !l.some((q) => q.id === id));
          f = l;
        }
        const chosen = f[Math.floor(Math.random() * f.length)];
        const frames = [];
        let offset = 0;
        for (let i = 0; i < 16; i++) {
          const question = f[Math.floor(Math.random() * f.length)];
          frames.push({
            at: offset,
            t: question.t,
            x: question.kind === "reverse" ? "كلمة معكوسة" : question.x,
          });
          offset += 55 + i * 22;
        }
        frames.push({
          at: offset,
          t: chosen.t,
          x: chosen.kind === "reverse" ? "كلمة معكوسة" : chosen.x,
        });
        sel(chosen.id, true, {
          started: Date.now(),
          duration: offset + 500,
          frames,
        });
      }
      function sel(id, show = false, roulette = null) {
        G.cur = {
          id,
          q: show ? 1 : 0,
          o: 0,
          a: 0,
          displayId: show ? `${Date.now()}-${Math.random()}` : null,
          roulette,
          buz: null,
          res: null,
          revealed: [],
          rank: null,
          awards: [],
          rev: { index: 0, letter: "", started: 0 },
        };
        if (!G.used.includes(id)) G.used.push(id);
        if (show)
          startQuestionTimer(
            cq(),
            Date.now() + (roulette?.duration || 0),
          );
        save();
      }
      function nextReverseLetter() {
        const q = cq(),
